name: Validate payload

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Keep the baseline on every host and probe the newer interpreter on
        # Ubuntu without multiplying every OS/version combination.
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
        include:
          - os: ubuntu-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse payload TOML
        shell: python
        run: |
          import pathlib
          import tomllib

          for path in pathlib.Path("payload").rglob("*.toml"):
              with path.open("rb") as handle:
                  tomllib.load(handle)
          with pathlib.Path("profiles/reference.toml").open("rb") as handle:
              tomllib.load(handle)
      - name: Validate source layout
        run: python scripts/doctor.py --source .
      - name: Run focused tests
        run: python -m unittest discover -s tests -p "test_*.py"
