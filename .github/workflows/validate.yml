name: Validate payload

on:
  push:
  pull_request:

jobs:
  validate:
    name: Validate (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Start with one supported Python version; broaden only after the
        # current matrix has produced evidence on every host.
        os:
          - windows-latest
          - ubuntu-latest
          - macos-latest
        python-version:
          - "3.11"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Parse payload TOML
        shell: python
        run: |
          import pathlib
          import tomllib

          for path in pathlib.Path("payload").rglob("*.toml"):
              with path.open("rb") as handle:
                  tomllib.load(handle)
          with pathlib.Path("profiles/reference.toml").open("rb") as handle:
              tomllib.load(handle)
      - name: Validate source layout
        run: python scripts/doctor.py --source .
      - name: Run focused tests
        run: python -m unittest discover -s tests -p "test_*.py"
